
{% load static %}
<link rel="stylesheet" href="{% static 'css/base/coloresCustom.css' %}">
<link rel="stylesheet" href="{% static 'css/Dashboard/producto_terminado.css' %}">

<div id="dashboard-producto-terminado">
    <!-- INDICADORES -->
    <div class="container-fluid px-0 mb-4">
        <div class="row g-3">
            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-primary h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-box-seam fs-4 icono-primary"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Total Productos</h6>
                                <h3 id="total_productos" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-warning h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-warning bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-exclamation-triangle fs-4 text-warning"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Bajo Mínimo</h6>
                                <h3 id="productos_bajo_min" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-danger h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-danger bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-x-octagon fs-4 text-danger"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Sin Stock</h6>
                                <h3 id="productos_sin_stock" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-success h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-clock-history fs-4 text-success"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Pedidos Pendientes</h6>
                                <h4 id="pedidos_pendientes" class="mb-0 fw-bold">...</h4>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MÉTRICAS ADICIONALES -->
    <div class="row g-4 mb-4" id="indicadores"></div>

    <!-- ACCESOS DIRECTOS -->
    <div class="row g-4 mb-4">
        <div class="col-6 col-md-3">
            <a href="{% url 'registrar_entradaPT' %}" class="text-decoration-none">
                <div class="dashboard-card card h-100 text-center pt-4 pb-3">
                    <div class="card-icon bg-success bg-opacity-10">
                        <i class="bi bi-box-arrow-in-down text-success fs-2"></i>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-0">Entrada Manual</h5>
                        <small class="text-muted">Producto Terminado</small>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="{% url 'registrar_salidaPT' %}" class="text-decoration-none">
                <div class="dashboard-card card h-100 text-center pt-4 pb-3">
                    <div class="card-icon bg-danger bg-opacity-10">
                        <i class="bi bi-box-arrow-up text-danger fs-2"></i>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-0">Salida Manual</h5>
                        <small class="text-muted">Producto Terminado</small>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="{% url 'lista_pedidos_reparto' %}" class="text-decoration-none">
                <div class="dashboard-card card h-100 text-center pt-4 pb-3">
                    <div class="card-icon bg-primary bg-opacity-10">
                        <i class="bi bi-truck text-primary fs-2"></i>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-0">Pedidos de Ruta</h5>
                        <small class="text-muted">Reabastecimiento</small>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="{% url 'minibodega_lista' %}" class="text-decoration-none">
                <div class="dashboard-card card h-100 text-center pt-4 pb-3">
                    <div class="card-icon bg-warning bg-opacity-10">
                        <i class="bi bi-shop text-warning fs-2"></i>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-0">Bodegas de Ruta</h5>
                        <small class="text-muted">Gestión de Inventario</small>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- GRÁFICA -->
    <div class="card dashboard-grafica mb-4">
        <div class="card-body">
            <div id="chart-entradas-salidas"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="{% static 'js/Dashboard/producto_terminado.js' %}" defer></script>
