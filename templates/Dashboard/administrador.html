
{% load static %}
<link rel="stylesheet" href="{% static 'css/base/coloresCustom.css' %}">
<link rel="stylesheet" href="{% static 'css/Dashboard/administrador.css' %}">

<div id="dashboard-administrador">
    <!-- INVENTARIO A GRANEL -->
    <div class="container-fluid px-0 mb-4">
        <div class="dashboard-encabezado p-3 rounded mb-4 d-flex align-items-center">
            <i class="bi bi-boxes fs-2 me-3 dashboard-icono-titulo"></i>
            <div>
                <h2 class="h4 mb-0 dashboard-titulo">Inventario Producto a Granel</h2>
                <small class="text-muted">Resumen general del stock a granel</small>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-primary h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-box-seam fs-4 icono-primary"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Total Productos</h6>
                                <h3 id="total_productos" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-warning h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-warning bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-exclamation-triangle fs-4 text-warning"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Bajo Mínimo</h6>
                                <h3 id="productos_bajo_min" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-danger h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-danger bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-x-octagon fs-4 text-danger"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Sin Stock</h6>
                                <h3 id="productos_sin_stock" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-success h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-currency-dollar fs-4 text-success"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Valor Total</h6>
                                <h4 id="valor_total_stock" class="mb-0 fw-bold">...</h4>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card dashboard-grafica mb-4">
        <div class="card-body">
            <div id="chart-entradas-salidasPG"></div>
        </div>
    </div>
    <div class="card dashboard-grafica mb-4">
        <div class="card-body">
            <div id="chart-top-productosPG"></div>
        </div>
    </div>

    <!-- INVENTARIO PRODUCTO TERMINADO -->
    <div class="container-fluid px-0 mb-4 mt-4">
        <div class="dashboard-encabezado p-3 rounded mb-4 d-flex align-items-center">
            <i class="bi bi-boxes fs-2 me-3 dashboard-icono-titulo"></i>
            <div>
                <h2 class="h4 mb-0 dashboard-titulo">Inventario Producto Terminado</h2>
                <small class="text-muted">Resumen general del stock terminado</small>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-primary h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-box-seam fs-4 icono-primary"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Total Productos</h6>
                                <h3 id="total_productosPT" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-warning h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-warning bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-exclamation-triangle fs-4 text-warning"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Bajo Mínimo</h6>
                                <h3 id="productos_bajo_minPT" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-danger h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-danger bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-x-octagon fs-4 text-danger"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Sin Stock</h6>
                                <h3 id="productos_sin_stockPT" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-success h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-currency-dollar fs-4 text-success"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Valor Total</h6>
                                <h4 id="valor_total_stockPT" class="mb-0 fw-bold">...</h4>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card dashboard-grafica mb-4">
        <div class="card-body">
            <div id="chart-entradas-salidasPT"></div>
        </div>
    </div>
    <div class="card dashboard-grafica mb-4">
        <div class="card-body">
            <div id="chart-top-productosPT"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="{% static 'js/Dashboard/administrador.js' %}" defer></script>
