
{% load static %}
<link rel="stylesheet" href="{% static 'css/base/coloresCustom.css' %}">
<link rel="stylesheet" href="{% static 'css/Dashboard/recursos_humanos.css' %}">

<div id="dashboard-recursos-humanos" data-stock-url="{% url 'recursos_humanos_json' %}">
    <!-- INDICADORES -->
    <div class="container-fluid px-0 mb-4">
        <div class="dashboard-encabezado p-3 rounded mb-4 d-flex align-items-center">
            <i class="bi bi-boxes fs-2 me-3 dashboard-icono-titulo"></i>
            <div>
                <h2 class="h4 mb-0 dashboard-titulo">Indicadores de Inventario a Granel</h2>
                <small class="text-muted">Resumen general del stock a granel</small>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-primary h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-box-seam fs-4 icono-primary"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Total Productos</h6>
                                <h3 id="total_productos" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-warning h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-warning bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-exclamation-triangle fs-4 text-warning"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Bajo Mínimo</h6>
                                <h3 id="productos_bajo_min" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-danger h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-danger bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-x-octagon fs-4 text-danger"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Sin Stock</h6>
                                <h3 id="productos_sin_stock" class="mb-0 fw-bold">...</h3>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>

            <div class="col-md-6 col-xl-3">
                <div class="card card-indicator indicador-success h-100 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-currency-dollar fs-4 text-success"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Valor Total</h6>
                                <h4 id="valor_total_stock" class="mb-0 fw-bold">...</h4>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-linea"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- TABLA BAJO STOCK -->
    <div class="dashboard-tabla mb-4 border rounded p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h3 class="h5 mb-0">
                <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Bajo Stock
            </h3>
            <span class="badge bg-warning text-dark px-3 py-2" id="low-stock-count">0</span>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
                <thead>
                    <tr>
                        <th><i class="bi bi-box"></i> Producto</th>
                        <th><i class="bi bi-graph-down"></i> Stock</th>
                        <th><i class="bi bi-slash-circle"></i> Mínimo</th>
                        <th><i class="bi bi-truck"></i> Proveedor</th>
                        <th><i class="bi bi-telephone"></i> Contacto</th>
                    </tr>
                </thead>
                <tbody id="bajo-stock-body">
                    <tr>
                        <td colspan="5" class="text-center py-3">
                            <div class="spinner-border spinner-border-sm text-warning" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TABLA SIN STOCK -->
    <div class="dashboard-tabla border rounded p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h3 class="h5 mb-0">
                <i class="bi bi-x-octagon-fill text-danger me-2"></i>Sin Stock
            </h3>
            <span class="badge bg-danger px-3 py-2" id="no-stock-count">0</span>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
                <thead>
                    <tr>
                        <th><i class="bi bi-box"></i> Producto</th>
                        <th><i class="bi bi-truck"></i> Proveedor</th>
                        <th><i class="bi bi-telephone"></i> Contacto</th>
                    </tr>
                </thead>
                <tbody id="sin-stock-body">
                    <tr>
                        <td colspan="3" class="text-center py-3">
                            <div class="spinner-border spinner-border-sm text-danger" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="{% static 'js/Dashboard/recursos_humanos.js' %}" defer></script>
