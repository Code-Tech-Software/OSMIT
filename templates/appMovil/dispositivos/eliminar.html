{% extends "Base/Sidebar.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/base/coloresCustom.css' %}">

<div class="section-title">
    <span class="fw-bold text-dark">Gestión de Dispositivos</span>
    <span class="mx-2 text-dark">|</span>
    <span class="text-secondary">Eliminar Dispositivo</span>
</div>

<div class="custom-card mt-4">

<div class="text-center py-3">

    <i class="bi bi-exclamation-triangle text-danger"
       style="font-size: 3rem;"></i>

    <h5 class="fw-bold mt-3">
        ¿Eliminar dispositivo?
    </h5>

    <p class="text-muted">
        Estás a punto de eliminar el dispositivo
        <strong>{{ dispositivo.codigo }}</strong>.
    </p>

    <p class="text-danger small">
        Esta acción no se puede deshacer.
    </p>

    <form method="POST"
          action="{% url 'eliminar_dispositivo' dispositivo.id %}">

        {% csrf_token %}

        <div class="mt-4 d-flex justify-content-center gap-2">

            <button type="submit"
                    class="btn btn-danger btn-sm">
                <i class="bi bi-trash me-1"></i>
                Sí, eliminar
            </button>

            <a href="{% url 'lista_dispositivos' %}"
               class="btn btn-custom-secondary btn-sm">
                <i class="bi bi-arrow-return-left me-1"></i>
                Cancelar
            </a>

        </div>

    </form>

</div>


</div>

{% endblock %}
