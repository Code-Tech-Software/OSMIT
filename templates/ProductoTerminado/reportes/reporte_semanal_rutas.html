{% extends "Base/Sidebar.html" %}
{% block content %}
<div class="container-fluid py-4">
    <h2 class="fw-bold mb-4">Reporte semanal de salidas por ruta</h2>
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Generar reporte PDF</h5>
            <p class="text-muted">El documento incluirá las 11 rutas, cada una con sus propias tablas de productos normales y especiales.</p>
            <form action="{% url 'reporte_semanal_rutas_pdf' %}" method="get" target="_blank">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Fecha inicial</label>
                        <input type="date" name="inicio" class="form-control" value="{{ fecha_inicio }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Fecha final</label>
                        <input type="date" name="fin" class="form-control" value="{{ fecha_fin }}" required>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-file-earmark-pdf me-1"></i> Generar PDF
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
