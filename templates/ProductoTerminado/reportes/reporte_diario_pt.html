
{% extends "Base/Sidebar.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/ProductoTerminado/reporte_diario_pt.css' %}">

<div id="reporteDiarioPT" class="container-fluid py-4" data-url-datos="{% url 'reporte_diario_pt_datos' %}">
    <div class="mb-4">
        <h2 class="titulo-pagina">Inventario | Reporte Diario de Entradas y Salidas</h2>
    </div>

    <!-- FILTROS -->
    <div class="filtros-card mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label for="filtroTipoProducto" class="form-label fw-bold">Tipo de producto</label>
                <select id="filtroTipoProducto" class="form-select">
                    <option value="normal">Normal</option>
                    <option value="especial">Especial</option>
                </select>
            </div>
            <div class="col-md-3 d-none" id="contenedorEspecial">
                <label for="filtroEspecial" class="form-label fw-bold">Tienda especial</label>
                <select id="filtroEspecial" class="form-select">
                    <option value="ML">Mega Lupita</option>
                    <option value="Y">Yeos</option>
                    <option value="YML">Super la merced</option>
                    <option value="YV">Yeos Victoria</option>
                    <option value="JP">Juaquin Perez</option>
                    <option value="N">Norma</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="filtroMovimiento" class="form-label fw-bold">Movimiento</label>
                <select id="filtroMovimiento" class="form-select">
                    <option value="salidas">Salidas</option>
                    <option value="entradas">Entradas</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="filtroFecha" class="form-label fw-bold">Fecha</label>
                <input type="date" id="filtroFecha" class="form-control" value="{{ fecha_actual }}">
            </div>
            <div class="col-md-3" id="contenedorDestino">
                <label for="filtroDestino" class="form-label fw-bold">Destino</label>
                <select id="filtroDestino" class="form-select">
                    <option value="general">General (Todos)</option>
                    <option value="opcion1">Ruta</option>
                    <option value="opcion2">Mitsu</option>
                    <option value="opcion3">Maestro</option>
                    <option value="opcion4">Otros</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-primary w-100" id="btnConsultar">
                    <i class="bi bi-search me-1"></i> Consultar
                </button>
            </div>
        </div>
    </div>

    <!-- TABLA -->
    <div class="tabla-card">
        <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="mostrarStock">
                <label class="form-check-label fw-semibold" for="mostrarStock">Mostrar stock actual</label>
            </div>
            <button type="button" class="btn btn-success" id="btnDescargarImagen">
                <i class="bi bi-image me-1"></i> Descargar imagen
            </button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
            <div>
                <h5 class="fw-bold mb-1" id="tituloReporte">Reporte de Salidas</h5>
                <span class="text-muted" id="subtituloReporte">Selecciona una fecha para consultar.</span>
            </div>
            <div id="indicadorCarga" class="d-none">
                <span class="spinner-border spinner-border-sm text-primary"></span>
                <span class="text-muted ms-2">Cargando...</span>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-striped tabla-reporte mb-0">
                <thead>
                    <tr id="encabezadoTabla"><th>Producto</th></tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <tr><td class="text-center text-muted">Cargando reporte...</td></tr>
                </tbody>
                <tfoot id="pieTabla"></tfoot>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="{% static 'js/ProductoTerminado/reporte_diario_pt.js' %}" defer></script>
{% endblock %}
